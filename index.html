<!DOCTYPE html>
<html lang="pt-BR" class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>Dashboard Eletrize</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />
        
        <link href="https://fonts.googleapis.com/css?family=Raleway:300,500,700&display=swap" rel="stylesheet" />

        <style>
            html,
            body {
                height: 100%;
            }

            body {
                margin: 0;
                background: #121212;
                font-family: 'Raleway', Arial, sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            .lock-page {
                width: 100vw;
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 32px 16px;
            }

            .lock-card {
                background: rgba(255, 255, 255, 0.18);
                border-radius: 24px;
                max-width: 370px;
                width: 100%;
                padding: 48px 36px 36px;
                text-align: center;
                box-shadow: 0 8px 32px 0 rgba(255, 255, 255, 0.37);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border: 1.5px solid rgba(255, 255, 255, 0.38);
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .lock-card form {
                width: 100%;
                display: flex;
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
                margin-top: 12px;
            }

            .lock-logo {
                width: 144px;
                margin-bottom: 12px;
                filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.18));
            }

            .lock-title {
                font-size: 2em;
                font-weight: 700;
                color: #fff;
                text-shadow: 0 2px 12px rgba(0, 0, 0, 0.18);
            }

            .lock-instructions {
                margin-top: -0.5em;
                margin-bottom: 0.5em;
                color: rgba(255, 255, 255, 0.85);
                font-weight: 300;
            }

            .lock-password-container {
                position: relative;
                background: rgba(255, 255, 255, 0.22);
                border-radius: 12px;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
                display: flex;
                align-items: center;
            }

            .lock-password-container:focus-within {
                box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.35), 0 2px 12px rgba(0, 0, 0, 0.24);
            }

            .lock-password-container input[type="password"],
            .lock-password-container input[type="text"] {
                font-family: 'Raleway', Arial, sans-serif;
                font-size: 1.1em;
                background: transparent;
                color: #fff;
                border-radius: 12px;
                border: none;
                padding: 15px 48px 15px 18px;
                width: 100%;
                box-sizing: border-box;
                outline: none;
            }

            .lock-password-container input[type="password"]::placeholder,
            .lock-password-container input[type="text"]::placeholder {
                color: rgba(255, 255, 255, 0.8);
                opacity: 1;
            }

            .lock-password-container input:-webkit-autofill {
                -webkit-text-fill-color: #fff;
                transition: background-color 9999s ease-in-out 0s;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                position: absolute;
                right: 14px;
                width: 24px;
                height: 24px;
                opacity: 0.75;
                transition: opacity 0.2s ease;
            }

            .staticrypt-toggle-password-visibility:hover,
            .staticrypt-toggle-password-visibility:focus {
                opacity: 1;
            }

            .lock-btn {
                font-family: 'Raleway', Arial, sans-serif;
                font-size: 1.1em;
                font-weight: 500;
                background: #121212;
                color: #fff;
                border-radius: 8px;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
                border: 1px solid rgba(255, 255, 255, 0.18);
                padding: 15px;
                width: 100%;
                cursor: pointer;
                transition: transform 0.2s ease, box-shadow 0.2s ease;
            }

            .lock-btn:hover,
            .lock-btn:focus {
                transform: translateY(-1px);
                box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
            }

            .lock-btn:focus-visible {
                outline: 2px solid rgba(255, 255, 255, 0.6);
                outline-offset: 2px;
            }

            .staticrypt-remember {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                margin-top: 6px;
                color: rgba(255, 255, 255, 0.85);
                font-size: 0.95em;
            }

            .staticrypt-remember input[type="checkbox"] {
                width: 18px;
                height: 18px;
                accent-color: #121212;
            }

            .hidden {
                display: none !important;
            }

            .lock-spinner {
                width: 3rem;
                height: 3rem;
                border: 0.25em solid rgba(255, 255, 255, 0.35);
                border-top-color: #ffffff;
                border-radius: 50%;
                animation: lock-spin 0.75s linear infinite;
                margin-top: 12px;
            }

            .lock-page.lock-animate-out {
                animation: lock-page-fade 260ms ease forwards;
            }

            .lock-page.lock-animate-out .lock-card {
                animation: lock-card-fade 260ms ease forwards;
            }

            @keyframes lock-spin {
                to {
                    transform: rotate(360deg);
                }
            }

            @keyframes lock-page-fade {
                to {
                    opacity: 0;
                }
            }

            @keyframes lock-card-fade {
                to {
                    opacity: 0;
                    transform: translateY(16px);
                    filter: blur(2px);
                }
            }

            @media (max-width: 480px) {
                .lock-card {
                    padding: 40px 28px 28px;
                }

                .lock-logo {
                    width: 120px;
                }
            }
        </style>
    </head>
